name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Alice1nRootland
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300f0ff&color_dots=%230b1520,%23144050,%2315798e,%2300bcd4,%2300f0ff
      - name: Publish generated animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
